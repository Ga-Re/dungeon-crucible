[package]
name = "dungeon-crucible"
version = "0.1.0"
description = "Campaign tool for D&D 5e: plan, build maps, run sessions with a table display"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dungeon_crucible_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
