<title>Dungeon Crucible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Fusion-artige Hülle — App-Leiste → Ribbon (Arbeitsbereich + Tabs + Werkzeuggruppen) → [Dock L | Arbeitscanvas | Dock R] → Dock unten → Statusleiste */
:root{
  --bg:#17191d; --shell:#22252a; --ribbon:#2a2d33; --panel:#2b2f35; --panel-2:#343840; --input:#1d2024;
  --line:#3e434b; --line-soft:#30343a;
  --fg:#dadee4; --fg-dim:#9aa2ad; --fg-faint:#69717c;
  --accent:#e2a03c; --accent-soft:rgba(226,160,60,.16);
  --sel:#3f9de2; --sel-soft:rgba(63,157,226,.18);
  --ok:#5db776; --warn:#e3b341; --crit:#e2554c; --arcane:#a77bf3;
  --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:12.5px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--input);border:1px solid var(--line);border-radius:3px;padding:4px 6px;min-width:0}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

#app{display:grid;grid-template-rows:34px auto 1fr auto 22px;height:100%}

/* App-Leiste */
#appbar{display:flex;align-items:center;gap:4px;background:var(--shell);border-bottom:1px solid #111;padding:0 8px;min-width:0}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--font-head);font-weight:700;font-size:15px;letter-spacing:.04em;padding-right:10px;margin-right:2px;border-right:1px solid var(--line);white-space:nowrap}
.brand .mark{width:20px;height:20px;border-radius:3px;background:linear-gradient(135deg,var(--accent),#a4511f);display:grid;place-items:center;color:#1a1208}
.brand .mark .ic{width:14px;height:14px;stroke-width:2.2}
.ab-btn{height:26px;min-width:26px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:3px;padding:0 6px;color:var(--fg-dim)}
.ab-btn:hover{background:var(--panel-2);color:var(--fg)}
.doc-tabs{display:flex;align-items:flex-end;align-self:stretch;gap:2px;margin-left:8px;min-width:0;overflow:hidden}
.doc-tab{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:4px 4px 0 0;background:var(--panel);color:var(--fg-dim);white-space:nowrap;border:1px solid var(--line);border-bottom:0;font-size:12px}
.doc-tab.on{background:var(--ribbon);color:var(--fg)}
.doc-tab .ic{width:13px;height:13px}
.ab-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.out-pill{display:flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:11.5px;color:var(--fg-dim);white-space:nowrap}
.out-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
.out-pill.black .dot{background:var(--crit);box-shadow:0 0 6px var(--crit)}
.out-pill.off .dot{background:var(--fg-faint);box-shadow:none}
.avatar{width:24px;height:24px;border-radius:50%;background:#4a3a6a;display:grid;place-items:center;font-weight:600;font-size:11px}

/* Ribbon */
#ribbon{background:var(--ribbon);border-bottom:1px solid #111;display:grid;grid-template-columns:auto 1fr;min-width:0}
#wsSwitch{grid-row:1/3;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:3px;padding:6px 14px;border-right:1px solid var(--line);min-width:172px;position:relative}
#wsSwitch .lbl{font-size:10px;color:var(--fg-faint);letter-spacing:.08em;text-transform:uppercase}
#wsBtn{display:flex;align-items:center;gap:8px;font-family:var(--font-head);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;padding:4px 8px 4px 4px;border-radius:3px;color:var(--fg)}
#wsBtn:hover{background:var(--panel-2)}
#wsBtn .wsic{width:28px;height:28px;border-radius:4px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
#wsMenu{position:absolute;top:100%;left:8px;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 12px 30px rgba(0,0,0,.5);padding:4px;width:290px}
.wsItem{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:3px;text-align:left}
.wsItem:hover{background:var(--panel-2)}
.wsItem.on{background:var(--sel-soft)}
.wsItem b{display:block;font-family:var(--font-head);font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.wsItem span{color:var(--fg-dim);font-size:11.5px}
.wsItem .wsic{width:30px;height:30px;border-radius:4px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
#rTabs{display:flex;gap:2px;padding:0 6px;border-bottom:1px solid var(--line-soft);overflow-x:auto;scrollbar-width:none}
.rtab{padding:6px 12px 5px;font-family:var(--font-head);font-weight:600;font-size:12.5px;letter-spacing:.08em;color:var(--fg-dim);border-bottom:2px solid transparent;white-space:nowrap}
.rtab:hover{color:var(--fg)}
.rtab.on{color:var(--fg);border-bottom-color:var(--accent)}
#rTools{display:flex;align-items:stretch;padding:4px 4px 0;overflow-x:auto;min-width:0;scrollbar-width:thin}
.rgroup{display:flex;flex-direction:column;border-right:1px solid var(--line-soft);padding:0 4px}
.rgroup .tools{display:flex;gap:1px;flex:1}
.rgroup .glabel{display:flex;align-items:center;justify-content:center;gap:3px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-faint);padding:2px 0 4px;white-space:nowrap}
.rgroup .glabel .ic{width:10px;height:10px}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;width:62px;padding:4px 2px 3px;border-radius:3px;color:var(--fg);position:relative}
.tool .ic{width:26px;height:26px;stroke-width:1.4}
.tool .ic .acc{stroke:var(--accent)}
.tool span{font-size:10.5px;line-height:1.15;color:var(--fg-dim);text-align:center}
.tool:hover{background:var(--panel-2)}
.tool.on{background:var(--sel-soft);box-shadow:inset 0 0 0 1px rgba(63,157,226,.55)}
.tool.on span{color:var(--fg)}
.tool .dd{position:absolute;right:3px;top:3px;width:9px;height:9px;opacity:.6}
.tool.tgl.active{color:var(--accent)}
.tool.tgl.active span{color:var(--accent)}

/* Arbeitsfläche */
#work{display:grid;grid-template-columns:auto auto 1fr auto auto;min-height:0;position:relative}
.dock{display:flex;flex-direction:column;background:var(--shell);min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
#dockL{border-right:1px solid #111}
#dockR{border-left:1px solid #111}
.dock:empty{display:none}
.splitter{width:4px;cursor:col-resize;background:transparent;position:relative;z-index:5}
.splitter:hover,.splitter.drag{background:var(--sel)}
.splitter.hidden{display:none}
#center{position:relative;min-width:0;min-height:0;background:#0e0f11;overflow:hidden}
.view{position:absolute;inset:0}

/* Panels */
.panel{display:flex;flex-direction:column;background:var(--panel);border-bottom:1px solid #15171a;min-height:0;flex:none}
.panel .ph{display:flex;align-items:center;gap:6px;height:27px;padding:0 4px 0 8px;background:var(--panel-2);border-bottom:1px solid var(--line-soft);cursor:grab;user-select:none;flex:none}
.panel .ph:active{cursor:grabbing}
.panel .ph .ic{width:14px;height:14px;color:var(--fg-dim)}
.panel .ph b{font-family:var(--font-head);font-weight:600;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel .ph button{width:22px;height:22px;border-radius:3px;display:grid;place-items:center;color:var(--fg-faint)}
.panel .ph button:hover{background:var(--line);color:var(--fg)}
.panel .ph button .ic{width:13px;height:13px}
.panel .pb{padding:8px;overflow:auto;min-height:0}
.panel.collapsed .pb{display:none}
.panel.collapsed .ph .chev{transform:rotate(-90deg)}
.panel.floating{position:absolute;z-index:40;max-height:calc(100% - 16px);border:1px solid var(--line);border-radius:4px;box-shadow:0 18px 40px rgba(0,0,0,.55);resize:both;overflow:hidden;min-width:220px;min-height:60px}
.panel.floating .pb{flex:1}
.panel.dragging{opacity:.88;pointer-events:none}
#floatLayer{position:absolute;inset:0;pointer-events:none;z-index:40}
#floatLayer>*{pointer-events:auto}
.dropzone{position:absolute;z-index:80;background:rgba(63,157,226,.14);border:2px dashed rgba(63,157,226,.7);border-radius:4px;display:none;align-items:center;justify-content:center;color:#cfe6f8;font-family:var(--font-head);font-size:13px;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
.dropzone.show{display:flex}
.dropzone.hot{background:rgba(63,157,226,.32)}

/* Dock unten (Tabs) */
#dockB{background:var(--shell);border-top:1px solid #111;display:flex;flex-direction:column;min-height:0;position:relative}
#dockB.empty{display:none}
#dockB .btabs{display:flex;align-items:center;gap:2px;background:var(--panel-2);border-bottom:1px solid var(--line-soft);padding:0 4px;height:27px}
#dockB .btab{display:flex;align-items:center;gap:5px;height:26px;padding:0 10px;font-family:var(--font-head);font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-dim);border-bottom:2px solid transparent;cursor:grab;white-space:nowrap}
#dockB .btab .ic{width:13px;height:13px}
#dockB .btab.on{color:var(--fg);border-bottom-color:var(--accent)}
#dockB .btab-spacer{flex:1}
#dockB .bbody{height:var(--bh,168px);overflow:hidden;display:flex}
#dockB .bbody>.panel{flex:1;border:0;background:var(--panel)}
#dockB .bbody>.panel>.ph{display:none}
#dockB .bbody>.panel>.pb{flex:1}
#dockB.min .bbody{display:none}
#bSplit{position:absolute;top:-3px;left:0;right:0;height:5px;cursor:row-resize;z-index:6}
#bSplit:hover{background:var(--sel)}

/* Statusleiste */
#status{display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--shell);border-top:1px solid #111;font-size:11px;color:var(--fg-dim);white-space:nowrap;overflow:hidden}
#status .sep{width:1px;height:12px;background:var(--line)}
#status .safe{color:var(--ok)}
#status .safe.bad{color:var(--crit)}

/* Formularzeilen */
.row{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:6px;margin-bottom:6px}
.row>label{color:var(--fg-dim);font-size:11.5px}
.row>*{min-width:0}
.sec{font-family:var(--font-head);font-weight:600;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-faint);margin:10px 0 6px;display:flex;align-items:center;gap:6px}
.sec::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.sec:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-size:11px;color:var(--fg)}
.chip.add{color:var(--fg-dim);border-style:dashed}
.chip.cond{background:rgba(167,123,243,.14);border-color:rgba(167,123,243,.45)}
.chip x{opacity:.6;cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1;padding:4px 6px;font-size:11.5px;color:var(--fg-dim);border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--sel-soft);color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:26px;padding:0 10px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line);font-size:12px;white-space:nowrap}
.btn:hover{border-color:#59606b}
.btn.pri{background:var(--accent);color:#22160a;border-color:var(--accent);font-weight:600}
.btn.danger{color:#ffb4ae;border-color:rgba(226,85,76,.5)}
.btn .ic{width:14px;height:14px}
.btn.sm{height:22px;padding:0 7px;font-size:11px}
.hint{color:var(--fg-faint);font-size:11px;line-height:1.45}
.file{display:flex;gap:4px}
.file input{flex:1}

/* Browser-Baum */
.tree{list-style:none;margin:0;padding:0}
.tree ul{list-style:none;margin:0;padding-left:14px}
.tn{display:flex;align-items:center;gap:5px;height:23px;padding:0 4px;border-radius:3px;cursor:pointer;white-space:nowrap}
.tn:hover{background:var(--panel-2)}
.tn.sel{background:var(--sel-soft)}
.tn .tw{width:12px;height:12px;color:var(--fg-faint);flex:none}
.tn .ic{width:14px;height:14px;color:var(--fg-dim)}
.tn .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.tn .meta{color:var(--fg-faint);font-size:10.5px}
.tn .eye{width:18px;height:18px;display:grid;place-items:center;color:var(--fg-faint);border-radius:2px}
.tn .eye:hover{color:var(--fg)}
.tn .eye .ic{width:13px;height:13px}
.swatch{width:10px;height:10px;border-radius:2px;flex:none}
li.closed>ul{display:none}
li.closed>.tn .tw{transform:rotate(-90deg)}

/* Karten-Canvas Overlays */
#mapCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#navbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:rgba(34,37,42,.94);border:1px solid var(--line);border-radius:5px;padding:3px;box-shadow:0 8px 20px rgba(0,0,0,.4);z-index:10;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
#navbar .nb{width:30px;height:28px;border-radius:3px;display:grid;place-items:center;color:var(--fg-dim);flex:none}
#navbar .nb:hover{background:var(--panel-2);color:var(--fg)}
#navbar .nb.on{color:var(--accent);background:var(--accent-soft)}
#navbar .vsep{width:1px;height:18px;background:var(--line);margin:0 3px;flex:none}
#navbar .seg{margin:0 2px;flex:none}
#navbar .seg button{padding:4px 9px}
#compass{position:absolute;right:14px;top:12px;width:84px;z-index:10;user-select:none}
#compass .cube{width:64px;height:64px;margin:0 auto;border:1px solid #5a616b;border-radius:4px;background:linear-gradient(160deg,#3a3f47,#2a2e34);display:grid;place-items:center;font-family:var(--font-head);font-weight:700;letter-spacing:.06em;font-size:11px;color:var(--fg);position:relative;transition:transform .35s}
#compass .cube i{position:absolute;font-style:normal;font-size:10px;color:var(--fg-dim)}
#compass .cube i.n{top:-15px;left:50%;transform:translateX(-50%);color:var(--crit)}
#compass .cube i.s{bottom:-15px;left:50%;transform:translateX(-50%)}
#compass .cube i.w{left:-13px;top:50%;transform:translateY(-50%)}
#compass .cube i.o{right:-13px;top:50%;transform:translateY(-50%)}
#compass .cap{text-align:center;color:var(--fg-faint);font-size:10px;margin-top:18px;letter-spacing:.06em}
#toolHint{position:absolute;left:12px;top:12px;z-index:10;background:rgba(34,37,42,.92);border:1px solid var(--line);border-radius:4px;padding:6px 9px;max-width:min(360px,calc(100% - 130px));font-size:11.5px;color:var(--fg-dim);line-height:1.45}
#toolHint b{color:var(--fg);font-weight:600}
#modeBadge{position:absolute;left:12px;bottom:14px;z-index:10;font-family:var(--font-head);font-weight:600;letter-spacing:.08em;font-size:11.5px;text-transform:uppercase;padding:4px 8px;border-radius:3px;background:rgba(34,37,42,.92);border:1px solid var(--line)}
#modeBadge.player{color:var(--ok);border-color:rgba(93,183,118,.5)}

/* Spieleransicht-Fenster */
.win{position:absolute;z-index:45;background:var(--panel);border:1px solid var(--line);border-radius:5px;box-shadow:0 20px 50px rgba(0,0,0,.6);display:flex;flex-direction:column;resize:both;overflow:hidden;min-width:240px;min-height:180px}
.win .ph{display:flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 9px;background:var(--panel-2);border-bottom:1px solid var(--line-soft);cursor:grab;user-select:none}
.win .ph b{font-family:var(--font-head);font-weight:600;letter-spacing:.07em;text-transform:uppercase;font-size:12.5px;flex:1;white-space:nowrap;overflow:hidden}
.win .ph button{width:24px;height:22px;border-radius:3px;display:grid;place-items:center;color:var(--fg-dim)}
.win .ph button:hover{background:var(--line);color:var(--fg)}
.win .ph button.on{color:var(--crit)}
.win .ph .ic{width:14px;height:14px}
.win canvas{flex:1;width:100%;min-height:0;display:block;background:#000}
.win .wfoot{display:flex;align-items:center;gap:8px;padding:4px 8px;font-size:11px;color:var(--fg-dim);border-top:1px solid var(--line-soft)}
.live{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-weight:600;font-size:10.5px;letter-spacing:.08em}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}

/* Initiative */
.init-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.init-head .round{font-family:var(--font-head);font-weight:700;font-size:15px;letter-spacing:.05em}
.init-head .round small{color:var(--fg-faint);font-weight:500;font-size:11px;margin-left:4px}
.ini{display:grid;grid-template-columns:30px 1fr auto;gap:2px 8px;align-items:center;padding:6px 6px 6px 4px;border-radius:4px;border:1px solid transparent;margin-bottom:3px;cursor:pointer;position:relative}
.ini:hover{background:var(--panel-2)}
.ini.cur{background:var(--accent-soft);border-color:rgba(226,160,60,.5)}
.ini.cur::before{content:"";position:absolute;left:-1px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--accent)}
.ini.dead{opacity:.45}
.ini .iv{grid-row:1/3;font-family:var(--font-mono);font-weight:600;font-size:14px;text-align:center;color:var(--fg)}
.ini .nm{font-weight:600;display:flex;align-items:center;gap:5px;min-width:0}
.ini .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ini .tag{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 4px;border-radius:2px;background:var(--panel-2);color:var(--fg-dim);flex:none}
.ini .tag.m{color:#ffb4ae;background:rgba(226,85,76,.15)}
.ini .ac{grid-row:1/3;display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--fg-faint)}
.ini .ac b{font-family:var(--font-mono);font-size:13px;color:var(--fg)}
.hpbar{height:5px;border-radius:3px;background:#1a1c20;overflow:hidden}
.hpbar i{display:block;height:100%;border-radius:3px}
.ini .sub{display:flex;align-items:center;gap:6px;min-width:0}
.ini .sub .hp{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-dim);flex:none}
.ini .sub .hpbar{flex:1}
.ini .conds{grid-column:2/4;display:flex;flex-wrap:wrap;gap:3px}
.ini .hpctl{grid-column:2/4;display:none;gap:4px;align-items:center;margin-top:3px}
.ini.cur .hpctl,.ini.open .hpctl{display:flex}
.ini .hpctl input{width:48px;height:22px;padding:2px 4px}
.pop{position:fixed;z-index:90;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 14px 30px rgba(0,0,0,.55);padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:2px;width:250px}
.pop button{text-align:left;padding:4px 6px;border-radius:3px;font-size:11.5px}
.pop button:hover{background:var(--panel-2)}
.pop button.on{color:var(--arcane)}

/* Nebel-Biome */
.biomes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.biome{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border-radius:4px;border:1px solid var(--line);font-size:10px;color:var(--fg-dim);text-align:center;line-height:1.15}
.biome i{width:100%;height:22px;border-radius:3px;display:block}
.biome.on{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.legend3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:4px}
.legend3 div{border:1px solid var(--line);border-radius:3px;padding:4px;font-size:10.5px;color:var(--fg-dim);text-align:center}
.legend3 i{display:block;height:14px;border-radius:2px;margin-bottom:3px}

/* Asset-Bibliothek Mini */
.libgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.libitem{border:1px solid var(--line);border-radius:4px;padding:3px;background:var(--input);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--fg-dim)}
.libitem svg{width:100%;height:auto;aspect-ratio:1;border-radius:2px}
.libitem.on{border-color:var(--accent);color:var(--fg)}

/* Soundboard */
.sb{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.9fr);gap:14px;width:100%}
.amb{display:grid;grid-template-columns:28px 1fr 90px;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line-soft)}
.amb .play{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.amb .play.on{background:var(--accent);color:#22160a;border-color:var(--accent)}
.amb .play .ic{width:12px;height:12px}
.amb .t{display:flex;flex-direction:column;min-width:0}
.amb .t b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amb .t span{font-size:10.5px;color:var(--fg-faint)}
.wave{display:flex;align-items:flex-end;gap:2px;height:16px}
.wave i{width:3px;background:var(--accent);border-radius:1px;opacity:.85}
.sfx{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.sfx button{height:44px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--fg-dim)}
.sfx button:hover{border-color:var(--accent);color:var(--fg)}
.sfx button:active{background:var(--accent-soft)}
.sfx .ic{width:16px;height:16px}

/* Würfel */
.dice{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;width:100%}
.dbtns{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.dbtns button{height:34px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);font-family:var(--font-mono);font-weight:600;font-size:12px}
.dbtns button:hover{border-color:var(--accent)}
.dlog{display:flex;flex-direction:column;gap:3px;overflow:auto;max-height:100%}
.dres{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:3px;background:var(--input)}
.dres b{font-family:var(--font-mono);font-size:15px;min-width:30px;text-align:right}
.dres .crit{color:var(--accent)}
.dres .fail{color:var(--crit)}
.dres span{color:var(--fg-dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Zeitleiste */
.tl{display:flex;flex-direction:column;gap:8px;width:100%}
.tl-bar{display:flex;align-items:center;gap:6px}
.tl-track{flex:1;display:flex;align-items:center;gap:3px;padding:8px;background:var(--input);border:1px solid var(--line);border-radius:4px;overflow-x:auto;position:relative}
.tl-item{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:84px;padding:6px 4px;border-radius:4px;border:1px solid var(--line);background:var(--panel-2);font-size:10.5px;color:var(--fg-dim);cursor:pointer;text-align:center}
.tl-item .ic{width:18px;height:18px}
.tl-item.done{opacity:.55}
.tl-item.on{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.tl-item small{font-family:var(--font-mono);font-size:9.5px;color:var(--fg-faint)}
.tl-arrow{color:var(--fg-faint);flex:none}

/* Notizen */
.mdbar{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:6px;align-items:center}
.mdbar button{min-width:26px;height:24px;border-radius:3px;font-size:11.5px;font-weight:600;color:var(--fg-dim);padding:0 5px}
.mdbar button:hover{background:var(--panel-2);color:var(--fg)}
.mdbar .sp{flex:1}
.mded{background:var(--input);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-height:150px;line-height:1.55;font-size:12.5px;overflow:auto}
.mded h1{font-family:var(--font-head);font-size:18px;margin:0 0 6px;letter-spacing:.02em}
.mded h2{font-family:var(--font-head);font-size:15px;margin:10px 0 4px;color:var(--accent)}
.mded p{margin:0 0 6px}
.mded ul{margin:0 0 6px;padding-left:18px}
.mded blockquote{margin:6px 0;padding:4px 10px;border-left:3px solid var(--arcane);color:#cbbdf0;background:rgba(167,123,243,.08)}
.mded .wl{color:var(--sel);background:var(--sel-soft);border-radius:3px;padding:0 3px;cursor:pointer}
.mded .secret{background:rgba(226,85,76,.12);border:1px dashed rgba(226,85,76,.5);border-radius:3px;padding:4px 8px;margin:6px 0;color:#f3c3bf}
.mdsrc{width:100%;min-height:150px;font-family:var(--font-mono);font-size:11.5px;line-height:1.5;resize:vertical}
.sidecar{margin-top:6px;font-family:var(--font-mono);font-size:10.5px;color:var(--fg-faint);display:flex;gap:6px;align-items:center}

/* Asset-Vault */
#vaultView{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,1.35fr);background:var(--bg)}
.vgal{border-right:1px solid #111;display:flex;flex-direction:column;min-height:0}
.vbar{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line-soft);align-items:center}
.vbar input{flex:1}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;padding:10px;overflow:auto}
.vcard{border:1px solid var(--line);border-radius:5px;background:var(--panel);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left}
.vcard:hover{border-color:#59606b}
.vcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.vcard svg{width:100%;height:auto;aspect-ratio:4/3;display:block}
.vcard .vc{padding:5px 7px 6px}
.vcard b{display:block;font-weight:500;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard span{font-size:10px;color:var(--fg-faint)}
.vcard .vn{float:right;font-family:var(--font-mono);font-size:9.5px;color:var(--accent)}
.vdet{display:flex;flex-direction:column;min-height:0;overflow:auto}
.vhead{padding:12px 16px 8px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.vhead h2{font-family:var(--font-head);font-size:22px;margin:0;letter-spacing:.02em}
.vhead .t{color:var(--fg-dim)}
.vtabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.vtab{padding:7px 12px;border-bottom:2px solid transparent;color:var(--fg-dim);display:flex;gap:6px;align-items:center}
.vtab.on{color:var(--fg);border-bottom-color:var(--accent)}
.vtab.add{color:var(--fg-faint)}
.vstage{position:relative;margin:12px 16px;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#0e0f11}
.vstage svg{display:block;width:100%;height:auto;aspect-ratio:16/10}
.vstage .badge{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);padding:3px 7px;border-radius:3px;font-size:11px}
.vprop{cursor:grab}
.vprop:hover{filter:brightness(1.25)}
.vprop.sel>*:first-child{stroke:var(--sel);stroke-width:2}
.vrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;padding:0 16px 16px}
.vbox{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:10px}
.vbox h3{margin:0 0 8px;font-family:var(--font-head);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim)}
.plist{display:flex;flex-direction:column;gap:2px}
.plist div{display:flex;align-items:center;gap:6px;padding:3px 5px;border-radius:3px}
.plist div.sel{background:var(--sel-soft)}
.plist .ic{width:14px;height:14px;color:var(--fg-dim)}

/* Kreaturen */
#creatureView{overflow:auto;background:var(--bg);padding:16px}
.sheet{max-width:860px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.sh-top{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.portrait{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-head);font-weight:700;font-size:26px;flex:none;border:4px solid}
.sh-top input.nm{font-family:var(--font-head);font-size:24px;font-weight:700;background:none;border:0;border-bottom:1px solid transparent;padding:0;width:100%}
.sh-top input.nm:hover,.sh-top input.nm:focus{border-bottom-color:var(--line)}
.sh-top .sub{color:var(--fg-dim);font-style:italic;margin-top:2px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:var(--input)}
.stat label{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-faint)}
.stat input{width:100%;border:0;background:none;padding:0;font-family:var(--font-mono);font-size:17px;font-weight:600}
.stat small{color:var(--fg-faint);font-family:var(--font-mono);font-size:10.5px}
.abil{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}
.ab{text-align:center;border:1px solid var(--line);border-radius:6px;padding:6px 2px 4px;background:var(--input)}
.ab label{font-family:var(--font-head);font-weight:700;letter-spacing:.08em;font-size:12px;color:var(--accent)}
.ab input{width:100%;text-align:center;border:0;background:none;font-family:var(--font-mono);font-size:17px;font-weight:600;padding:2px 0}
.ab .mod{display:inline-block;font-family:var(--font-mono);font-size:11.5px;padding:1px 7px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:12px;margin:8px 0}
.kv dt{color:var(--fg-dim);font-weight:600}
.kv dd{margin:0}
.actions h4{font-family:var(--font-head);letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:3px;margin:14px 0 6px}
.act{margin:0 0 6px;line-height:1.5}
.act b{font-style:italic}
.act .roll{font-family:var(--font-mono);color:var(--sel);cursor:pointer;border-bottom:1px dotted}
.tokprev{display:flex;flex-direction:column;align-items:center;gap:8px}
.tokprev canvas{width:150px;height:150px;border-radius:6px;background:#2a2620}

/* Kampagnen-Atlas */
#atlasView{background:radial-gradient(circle at 20% 10%,#1e2228,#121417 70%)}
#atlasSvg{width:100%;height:100%;display:block;touch-action:none}
.anode{cursor:grab}
.anode rect{stroke-width:1.2}
.anode.sel rect{stroke:var(--sel);stroke-width:2.2}
.anode text{font-family:var(--font-ui);font-size:12px;fill:var(--fg)}
.anode .k{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;fill:var(--fg-dim)}
.lane-t{font-family:var(--font-head);font-weight:700;font-size:15px;letter-spacing:.07em;fill:var(--fg-dim);text-transform:uppercase}
.atlas-legend{position:absolute;right:12px;top:12px;background:rgba(34,37,42,.92);border:1px solid var(--line);border-radius:4px;padding:8px 10px;display:grid;gap:4px;font-size:11px;color:var(--fg-dim)}
.atlas-legend div{display:flex;align-items:center;gap:6px}

/* Encounter */
.diff{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--ok) 0 25%,var(--warn) 25% 50%,#e98a3d 50% 75%,var(--crit) 75%);position:relative;margin:8px 0 4px}
.diff i{position:absolute;top:-4px;width:3px;height:18px;background:#fff;border-radius:2px;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.diffl{display:flex;justify-content:space-between;font-size:10px;color:var(--fg-faint)}
.mrow{display:grid;grid-template-columns:1fr 40px 54px;gap:6px;align-items:center;margin-bottom:4px}
.mrow input{padding:2px 4px;height:22px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl td{padding:4px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl td:first-child{font-family:var(--font-mono);color:var(--fg-faint);width:30px}
.tbl tr.hit td{background:var(--accent-soft);color:var(--fg)}
.log{display:flex;flex-direction:column;gap:2px;font-size:11.5px;overflow:auto;width:100%}
.log div{display:flex;gap:8px;padding:2px 4px;border-radius:2px}
.log div:nth-child(odd){background:rgba(255,255,255,.02)}
.log time{font-family:var(--font-mono);color:var(--fg-faint);flex:none}

/* Toast + Modal */
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--accent);padding:8px 14px;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transition:.2s;pointer-events:none;z-index:100;max-width:min(560px,calc(100% - 32px))}
#toast.show{opacity:1;transform:translateX(-50%)}
.modal-bg{position:fixed;inset:0;background:rgba(5,6,8,.6);z-index:95;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.6);width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto}
.modal header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.modal header h2{margin:0;font-family:var(--font-head);font-size:19px;letter-spacing:.04em;flex:1;text-wrap:balance}
.modal .mb{padding:14px 16px;line-height:1.55;color:var(--fg)}
.modal .mb p{margin:0 0 10px;max-width:64ch}
.modal .mb ul{margin:0 0 10px;padding-left:18px}
.modal .mb li{margin-bottom:3px}
.modal kbd{font-family:var(--font-mono);font-size:11px;background:var(--input);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line-soft)}
.ws-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:10px 0}
.ws-grid button{display:flex;gap:8px;align-items:center;text-align:left;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--input)}
.ws-grid button:hover{border-color:var(--accent)}
.ws-grid .wsic{width:28px;height:28px;border-radius:4px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ws-grid b{display:block;font-family:var(--font-head);letter-spacing:.04em;text-transform:uppercase;font-size:13px}
.ws-grid span{font-size:11px;color:var(--fg-dim)}

@media (max-width:900px){
  #dockL,#dockR,.splitter{display:none}
  .doc-tabs,.out-pill.dm{display:none}
  #wsSwitch{min-width:0;padding:6px 8px}
  #wsBtn{font-size:13px}
  .sheet{grid-template-columns:1fr}
  #vaultView{grid-template-columns:1fr;grid-template-rows:40% 60%}
  .vgal{border-right:0;border-bottom:1px solid #111}
  .sb,.dice{grid-template-columns:1fr}
  #compass{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

let baseWalls=[];
function computeWalls(){
  const hs={},vs={};
  const add=(m,k,a)=>{(m[k]=m[k]||[]).push(a)};
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){if(!isFloor(x,y))continue;
    if(!isFloor(x,y-1))add(hs,y,x);if(!isFloor(x,y+1))add(hs,y+1,x);
    if(!isFloor(x-1,y))add(vs,x,y);if(!isFloor(x+1,y))add(vs,x+1,y);}
  const segs=[];
  for(const k in hs){const a=[...new Set(hs[k])].sort((p,q)=>p-q);let s=a[0],p=a[0];for(let i=1;i<=a.length;i++){if(a[i]===p+1){p=a[i];continue}segs.push([s*C,k*C,(p+1)*C,k*C]);s=p=a[i]}}
  for(const k in vs){const a=[...new Set(vs[k])].sort((p,q)=>p-q);let s=a[0],p=a[0];for(let i=1;i<=a.length;i++){if(a[i]===p+1){p=a[i];continue}segs.push([k*C,s*C,k*C,(p+1)*C]);s=p=a[i]}}
  baseWalls=segs;
}

function assetBlockSegs(a){if(!a.blocks)return[];const r=a.kind==='statue'?C*.55:C*.45,n=8,out=[];for(let i=0;i<n;i++){const t1=i/n*Math.PI*2+.3,t2=(i+1)/n*Math.PI*2+.3;out.push([a.x+Math.cos(t1)*r,a.y+Math.sin(t1)*r,a.x+Math.cos(t2)*r,a.y+Math.sin(t2)*r])}return out}
function blockingSegs(){

/* ============================================================
   Sichtlinien (2D-Raycasting)
   ============================================================ */
let VIS=[]; // {tok, poly, r}
function visPoly(ox,oy,R,segsAll){
  const segs=segsAll.filter(s=>{const minx=Math.min(s[0],s[2]),maxx=Math.max(s[0],s[2]),miny=Math.min(s[1],s[3]),maxy=Math.max(s[1],s[3]);return maxx>=ox-R&&minx<=ox+R&&maxy>=oy-R&&miny<=oy+R});
  const b=[ox-R-2,oy-R-2,ox+R+2,oy+R+2];
  segs.push([b[0],b[1],b[2],b[1]],[b[2],b[1],b[2],b[3]],[b[2],b[3],b[0],b[3]],[b[0],b[3],b[0],b[1]]);
  const angs=[];
  for(const s of segs){for(const p of [[s[0],s[1]],[s[2],s[3]]]){const a=Math.atan2(p[1]-oy,p[0]-ox);angs.push(a-1e-4,a,a+1e-4)}}
  for(let i=0;i<48;i++)angs.push(-Math.PI+i/48*Math.PI*2);
  const pts=[];
  for(const a of angs){const dx=Math.cos(a),dy=Math.sin(a);let best=Infinity;
    for(const s of segs){const sx=s[2]-s[0],sy=s[3]-s[1];const den=dx*sy-dy*sx;if(Math.abs(den)<1e-9)continue;
      const qx=s[0]-ox,qy=s[1]-oy;const t=(qx*sy-qy*sx)/den,u=(qx*dy-qy*dx)/den;if(t>0&&u>=-1e-6&&u<=1+1e-6&&t<best)best=t}
    if(best<Infinity)pts.push({a,x:ox+dx*best,y:oy+dy*best})}
  pts.sort((p,q)=>p.a-q.a);return pts;
}
function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if(((a.y>y)!==(b.y>y))&&(x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x))c=!c}return c}
function updateVision(){
  const segs=blockingSegs();VIS=[];
  TOK.filter(t=>t.kind==='pc').forEach(t=>{const R=t.vis*C;const poly=visPoly(t.x,t.y,R,segs);VIS.push({tok:t,poly,r:R});
    const cx0=Math.floor((t.x-R)/C),cx1=Math.floor((t.x+R)/C),cy0=Math.floor((t.y-R)/C),cy1=Math.floor((t.y+R)/C);
    for(let y=Math.max(0,cy0);y<=Math.min(ROWS-1,cy1);y++)for(let x=Math.max(0,cx0);x<=Math.min(COLS-1,cx1);x++){
      const px=(x+.5)*C,py=(y+.5)*C;if(Math.hypot(px-t.x,py-t.y)>R)continue;if(!isFloor(x,y))continue;
      const seen=inPoly(px,py,poly)||[[1,1],[C-1,1],[1,C-1],[C-1,C-1]].some(([ox,oy])=>Math.hypot(x*C+ox-t.x,y*C+oy-t.y)<=R&&inPoly(x*C+ox,y*C+oy,poly));
      if(seen){explored[idx(x,y)]=1;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<COLS&&ny<ROWS&&!isFloor(nx,ny))explored[idx(nx,ny)]=1}}}
  });
}
function visibleToPlayers(x,y){return VIS.some(v=>Math.hypot(x-v.tok.x,y-v.tok.y)<=v.r&&inPoly(x,y,v.poly))}

const mapCanvas=document.createElement('canvas');mapCanvas.width=W;mapCanvas.height=H;
function hash(x,y){let h=x*374761393+y*668265263;h=(h^(h>>13))*1274126177;return((h^(h>>16))>>>0)/4294967295}
function renderStaticMap(){
  const g=mapCanvas.getContext('2d');
  g.fillStyle='#15171a';g.fillRect(0,0,W,H);
  for(let i=0;i<900;i++){const x=hash(i,7)*W,y=hash(i,13)*H,r=4+hash(i,3)*18;g.fillStyle=`rgba(255,255,255,${.012+hash(i,5)*.02})`;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
  // Schraffur an Wandkanten

function buildLivingFog(dt,t){

function tplShape(t){

  if(t.type==='cube'){const sx=Math.sign(t.dx)||1,sy=Math.sign(t.dy)||1;const x0=sx>0?t.x:t.x-L,y0=sy>0?t.y:t.y-L;return{kind:'poly',pts:[[x0,y0],[x0+L,y0],[x0+L,y0+L],[x0,y0+L]],label:`Würfel ${L/C*FT} ft`}}
  const a=Math.atan2(t.dy,t.dx);
  if(t.type==='cone'){const h=Math.atan(.5),r=L/Math.cos(h);return{kind:'poly',pts:[[t.x,t.y],[t.x+Math.cos(a-h)*r,t.y+Math.sin(a-h)*r],[t.x+Math.cos(a+h)*r,t.y+Math.sin(a+h)*r]],label:`Kegel ${L/C*FT} ft`}}

}

}

let pcv=null,pctx=null,playerSafe=true;
function renderPlayer(now){
  if(!pcv)return;const r=pcv.getBoundingClientRect();if(!r.width)return;
  const w=r.width*DPR|0,h=r.height*DPR|0;if(pcv.width!==w||pcv.height!==h){pcv.width=w;pcv.height=h}
  const g=pctx;g.setTransform(1,0,0,1,0,0);g.fillStyle='#000';g.fillRect(0,0,w,h);
  if(S.player.blackout){g.fillStyle='#3a1513';g.font=`600 ${12*DPR}px Inter`;g.textAlign='center';g.fillText('BLACKOUT – Spieler sehen Schwarz',w/2,h/2);playerSafe=true;return}
  try{
    if(S.player.fault)throw new Error('Simulierter Renderfehler');
    const rot=S.player.rot*Math.PI/180,swap=S.player.rot%180!==0;const mw=swap?H:W,mh=swap?W:H;const sc=Math.min(w/mw,h/mh);
    g.translate(w/2,h/2);g.rotate(rot);g.scale(sc,sc);g.translate(-W/2,-H/2);
    g.save();g.beginPath();g.rect(0,0,W,H);g.clip();drawScene(g,'player',now);g.restore();playerSafe=true;
  }catch(err){
    g.setTransform(1,0,0,1,0,0);g.fillStyle='#000';g.fillRect(0,0,w,h);playerSafe=false;
    g.fillStyle='#e2554c';g.font=`600 ${11*DPR}px Inter`;g.textAlign='center';g.fillText('Ausgabe gesperrt (fail-closed)',w/2,h/2-6*DPR);g.fillStyle='#6b727c';g.font=`${10*DPR}px Inter`;g.fillText('Spieler sehen nur Schwarz',w/2,h/2+10*DPR);
  }
}

   Haupt-Renderschleife
   ============================================================ */
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  stepSpreads(dt);buildFog();buildLivingFog(dt,now);
  S.pings=S.pings.filter(p=>now-p.t<1600);
  const mapVisible=!$('#mapView').hidden;
  if(mapVisible&&cv.width){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0e0f11';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.setTransform(DPR*S.view.z,0,0,DPR*S.view.z,DPR*S.view.x,DPR*S.view.y);
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(6,8,W,H);
    const mode=S.viewMode==='player'?'player':(S.ws==='forge'?'edit':'dm');
    try{ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();drawScene(ctx,mode,now);ctx.restore()}catch(e){ctx.restore()}
    ctx.strokeStyle='#3e434b';ctx.lineWidth=1/S.view.z;ctx.strokeRect(0,0,W,H);
    drawOverlay(ctx)}
  renderPlayer(now);
  requestAnimationFrame(frame);
}

/* Befehle */
function cmd(id){
  const T=(m)=>toast(m);
  switch(id){
    case 'gridsq':S.grid='square';log('Raster: Quadrat');break;
    case 'gridhex':S.grid='hex';log('Raster: Hex');break;
    case 'snap':S.snap=!S.snap;T(`Einrasten ${S.snap?'an':'aus'} – freie Bewegung ${S.snap?'deaktiviert':'aktiv'}`);break;
    case 'fit':fitView();break;
    case 'fogprev':S.fogVisibleForge=!S.fogVisibleForge;break;
    case 'pview':S.viewMode=S.viewMode==='player'?'dm':'player';updateModeBadge();break;
    case 'living':S.living=!S.living;refreshPanel('fog');break;
    case 'dmsee':S.dmSee=!S.dmSee;refreshPanel('fog');break;
    case 'fogall':explored.fill(0);updateVision();log('Nebel: alles verdeckt');break;
    case 'fogclear':for(let i=0;i<explored.length;i++){const z=zoneAt[i];if(z>=0&&ZONES[z].secret&&!ZONES[z].found)continue;explored[i]=1}log('Nebel: alles aufgedeckt (Geheimräume bleiben verborgen)');break;
    case 'import':case 'video':case 'newmap':$('#fileMap').click();break;
    case 'tiles':T(`GPU-Kacheln: Karten über 4096 px werden in ${S.bgInfo?S.bgInfo.tiles:'1×1'} Kacheln à 4096 px gezeichnet.`);break;
    case 'biome':case 'zbiome':openFloatingPanel('fog');break;
    case 'secretroom':S.selZone=5;refreshPanel('props');refreshPanel('browser');T('Geheimräume: Zone als „Geheimraum“ markieren. Sie bleiben für Spieler verborgen, bis du sie entdeckst.');break;
    case 'obstacle':S.libAsset='rock';setTool('asset');break;
    case 'testvis':S.viewMode='player';updateModeBadge();T('Sichtprüfung: Hauptansicht zeigt jetzt, was Spieler sehen. Token ziehen zum Testen.');buildRibbon();break;
    case 'undowall':if(userWalls.pop()){updateVision();refreshPanel('browser')}else T('Keine selbst gezeichneten Wände vorhanden.');break;
    case 'variants':case 'gotoVault':setWs('vault');break;
    case 'lights':T('Lichtquellen (Fackel, Laterne, Zauber „Licht“) folgen in Phase 2 – siehe Plan.');break;
    case 'rollinit':TOK.forEach(t=>{t.init=1+Math.floor(Math.random()*20)+(t.kind==='pc'?2:1)});S.turn=0;S.round=1;refreshPanel('initiative');log('Initiative neu gewürfelt');break;
    case 'next':nextTurn();break;
    case 'lock':S.moveLock=!S.moveLock;log(`Bewegungssperre für Spieler ${S.moveLock?'aktiv':'aufgehoben'}`);refreshPanel('player');break;
    case 'popen':if(!$('#playerWin'))openPlayerWin();else T('Spieleransicht ist bereits geöffnet.');break;
    case 'rotate':S.player.rot=(S.player.rot+90)%360;$('#cube').style.transform=`rotate(${S.player.rot}deg)`;log(`Tisch-Display gedreht: ${S.player.rot}°`);refreshPanel('player');break;
    case 'blackout':S.player.blackout=!S.player.blackout;log(`Blackout ${S.player.blackout?'AN':'aus'}`);refreshPanel('player');break;
    case 'tplclear':S.templates=[];break;
    case 'sload':case 'snext':T('Szenenwechsel: lädt Karte, Nebelzustand, Tokens und Ambience der nächsten Szene.');break;
    case 'shand':showModal('Handout: Brief des Aschenkönigs',`<blockquote style="margin:0;padding:12px 16px;background:#2c2519;border-left:3px solid var(--accent);font-style:italic;line-height:1.7">„Wer die Asche stört, erweckt den König. Drei Siegel halten ihn – Thron, Altar und das verborgene Herz.“</blockquote><p class="hint" style="margin-top:10px">„Auf Tisch zeigen“ blendet das Handout im Spielerfenster über die Karte.</p>`,[['Auf Tisch zeigen',()=>toast('Handout wird auf dem Tisch-Display angezeigt.'),'pri']]);break;
    case 'amb':case 'sfxd':showBottom('sound');break;
    case 'save':T('Gespeichert: <span class="mono">krypta-von-vhal.dm.json</span> + Szenen-Override <span class="mono">session-03.scene.json</span>');break;
    case 'undo':case 'redo':T('Verlauf: Rückgängig/Wiederholen über alle Arbeitsbereiche (Demo ohne Funktion).');break;
    case 'file':T('Datei: Kampagnenordner öffnen, Export (.zip), Import aus Foundry/Universal VTT (.dd2vtt).');break;
    case 'help':showWelcome();break;
    default:T(`<b>${esc(id)}</b> ist in dieser Design-Demo nur angedeutet.`);
  }
  buildRibbon();buildNav();
}

const PANELS={

  library:{t:'Asset-Bibliothek',i:'box'},initiative:{t:'Initiative',i:'swords'},player:{t:'Spieleransicht',i:'monitor'},

const LAYOUT={};
function curLayout(){if(!LAYOUT[S.ws]){const l=WS[S.ws].layout;LAYOUT[S.ws]={L:[...l.L],R:[...l.R],B:[...l.B],F:{},bActive:l.B[0]}}return LAYOUT[S.ws]}
function saveLayout(){}
function applyLayout(){
  const lay=curLayout();
  ['dockL','dockR','bBody'].forEach(d=>{$('#'+d).innerHTML=''});
  Object.values(PEL).forEach(el=>{el.classList.remove('floating');el.style.cssText='';el.remove()});
  lay.L.forEach(id=>$('#dockL').appendChild(PEL[id]));
  lay.R.forEach(id=>$('#dockR').appendChild(PEL[id]));
  if(!lay.B.includes(lay.bActive))lay.bActive=lay.B[0];
  lay.B.forEach(id=>{const el=PEL[id];el.hidden=id!==lay.bActive;$('#bBody').appendChild(el)});
  for(const id in lay.F){const f=lay.F[id];const el=PEL[id];el.classList.add('floating');el.hidden=false;el.style.left=f.x+'px';el.style.top=f.y+'px';el.style.width=(f.w||290)+'px';if(f.h)el.style.height=f.h+'px';$('#floatLayer').appendChild(el)}
  [...lay.L,...lay.R].forEach(id=>PEL[id].hidden=false);
  $('#splitL').classList.toggle('hidden',!lay.L.length);$('#splitR').classList.toggle('hidden',!lay.R.length);
  buildBottomTabs();
  Object.keys(PANELS).forEach(refreshPanel);
}
function buildBottomTabs(){const lay=curLayout();$('#dockB').classList.toggle('empty',!lay.B.length);
  $('#bTabs').innerHTML=lay.B.map(id=>`<div class="btab ${id===lay.bActive?'on':''}" data-b="${id}">${ico(PANELS[id].i)}${PANELS[id].t}</div>`).join('')+`<span class="btab-spacer"></span><button class="ab-btn" data-bmin title="Ein-/Ausklappen">${ico('chev')}</button><button class="ab-btn" data-bfloat title="Aktiven Tab abdocken">${ico('float')}</button>`;
  $$('#bTabs .btab').forEach(t=>t.addEventListener('pointerdown',e=>{const id=t.dataset.b;const sx=e.clientX,sy=e.clientY;
    const mv=ev=>{if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);startPanelDrag(ev,id,true)}};
    const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);showBottom(id)};
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up)}));
}
$('#bTabs').addEventListener('click',e=>{if(e.target.closest('[data-bmin]'))$('#dockB').classList.toggle('min');if(e.target.closest('[data-bfloat]'))toggleFloat(curLayout().bActive)});
function showBottom(id){const lay=curLayout();if(!lay.B.includes(id)){openFloatingPanel(id);return}lay.bActive=id;$('#dockB').classList.remove('min');lay.B.forEach(b=>PEL[b].hidden=b!==id);buildBottomTabs();refreshPanel(id)}
function removeFromLayout(id){const lay=curLayout();['L','R','B'].forEach(k=>{lay[k]=lay[k].filter(x=>x!==id)});delete lay.F[id]}
function where(id){const lay=curLayout();for(const k of ['L','R','B'])if(lay[k].includes(id))return k;if(lay.F[id])return 'F';return null}
function toggleFloat(id){const lay=curLayout();const w=where(id);const wr=$('#work').getBoundingClientRect();
  if(w==='F'){const back=lay.F[id].from||'R';removeFromLayout(id);lay[back].push(id);if(back==='B')lay.bActive=id}
  else{const r=PEL[id].getBoundingClientRect();removeFromLayout(id);{const h=w==='B'?260:Math.min(420,wr.height-40);lay.F[id]={x:clamp(r.left-wr.left-30,10,wr.width-300),y:clamp(r.top-wr.top+20,10,Math.max(10,wr.height-h-10)),w:Math.max(270,r.width),h,from:w||'R'}}}
  applyLayout()}
function openFloatingPanel(id){const lay=curLayout();if(where(id)){const w=where(id);if(w==='B')showBottom(id);else PEL[id].classList.remove('collapsed');return}const wr=$('#work').getBoundingClientRect();lay.F[id]={x:wr.width/2-150,y:60,w:300,h:Math.min(460,wr.height-80),from:'R'};applyLayout()}
function startPanelDrag(e,id,fromTab){
  if(!fromTab&&e.target.closest('button'))return;const el=PEL[id];const wr=$('#work').getBoundingClientRect();const r=el.getBoundingClientRect();
  const ox=fromTab?140:e.clientX-r.left,oy=fromTab?12:e.clientY-r.top;const sx=e.clientX,sy=e.clientY;let started=false;
  const zones={L:$('#dzL'),R:$('#dzR'),B:$('#dzB')};let hot=null;
  const cr=$('#center').getBoundingClientRect();
  const place=()=>{const top=cr.top-wr.top;zones.L.style.cssText=`left:8px;top:${top+8}px;width:120px;height:${cr.height-16}px`;zones.R.style.cssText=`right:8px;top:${top+8}px;width:120px;height:${cr.height-16}px`;zones.B.style.cssText=`left:${cr.left-wr.left+140}px;right:${wr.right-cr.right+140}px;bottom:8px;height:70px`};
  const mv=ev=>{if(!started){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;started=true;

  for(const t of terms){const sg=t[0]==='-'?-1:1;const b=t.replace(/^[+-]/,'');const m=b.match(/^(\d*)w(\d+)$/);if(m){const n=+(m[1]||1),s=+m[2];if(n>100||s>1000){toast('Zu viele Würfel.');return}const rs=Array.from({length:n},()=>1+rnd(s));if(n===1&&s===20)nat=rs[0];tot+=sg*rs.reduce((a,c)=>a+c,0);det.push(`[${rs.join(', ')}]`)}else if(/^\d+$/.test(b)){tot+=sg*+b;det.push((sg<0?'-':'+')+b)}else{toast('Ausdruck nicht erkannt. Beispiel: 2W6+3');return}}
  pushRoll({total:tot,expr:expr.toUpperCase().replace(/D/g,'W'),detail:det.join(' '),cls:nat===20?'crit':nat===1?'fail':''})}

  else{const o=a.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(110,t);o.frequency.linearRampToValueAtTime(60,t+.9);g.gain.setValueAtTime(.35,t);g.gain.linearRampToValueAtTime(0,t+1);o.connect(g);o.start(t);o.stop(t+1)}
